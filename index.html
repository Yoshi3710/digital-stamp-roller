<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ea">
<title>デジタルもよう工房｜スタンプ・スポンジローラー</title>
<style>
  :root {
    --ink:#263238;
    --muted:#68757b;
    --paper:#fffdf7;
    --panel:rgba(255,255,255,.92);
    --line:#d9ddd9;
    --accent:#ff7f50;
    --accent2:#2aa7a1;
    --shadow:0 14px 38px rgba(41,50,55,.12);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:
    radial-gradient(circle at 5% 0%,rgba(255,195,113,.25),transparent 28%),
    radial-gradient(circle at 100% 10%,rgba(93,211,201,.18),transparent 25%),
    #f5f2e9;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
  button,input{font:inherit}
  button{color:inherit}
  .app{max-width:1480px;margin:0 auto;padding:14px 16px 24px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 14px}
  .title-wrap{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#ff9d5c,#ffd56b 46%,#57d2c5);box-shadow:0 8px 20px rgba(255,127,80,.22);font-size:25px;flex:none}
  h1{font-size:clamp(20px,2.6vw,32px);line-height:1.1;margin:0;letter-spacing:.02em}
  .subtitle{margin:5px 0 0;color:var(--muted);font-size:13px}
  .badge{background:#263238;color:white;padding:7px 10px;border-radius:999px;font-size:12px;white-space:nowrap}

  .workspace{display:grid;grid-template-columns:minmax(280px,345px) minmax(0,1fr);gap:16px;align-items:start}
  .panel{background:var(--panel);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .controls{padding:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:thin}
  .section{padding:12px 0;border-bottom:1px solid #e8e9e5}
  .section:first-child{padding-top:0}.section:last-child{border-bottom:0;padding-bottom:0}
  .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-weight:800;font-size:14px}
  .hint{font-weight:500;color:var(--muted);font-size:11px}
  .tool-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tool-btn,.choice-btn,.action-btn,.bg-btn{border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;transition:.16s ease;touch-action:manipulation}
  .tool-btn{padding:11px 8px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px}
  .tool-btn:hover,.choice-btn:hover,.action-btn:hover,.bg-btn:hover{transform:translateY(-1px);border-color:#aeb9b6}
  .tool-btn.active{background:#263238;color:white;border-color:#263238;box-shadow:0 6px 14px rgba(38,50,56,.18)}
  .choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .choice-btn{min-height:52px;padding:5px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;font-size:10px}
  .choice-btn .shape{font-size:25px;line-height:1}
  .choice-btn.active{border:2px solid var(--accent);background:#fff8f3;padding:4px;box-shadow:0 4px 10px rgba(255,127,80,.12)}
  .roller-symbol{height:24px;width:34px;border-radius:7px;border:2px solid currentColor;display:block;position:relative;overflow:hidden}
  .roller-symbol.dots{background:radial-gradient(circle,currentColor 1.5px,transparent 2px) 0 0/8px 8px}
  .roller-symbol.stripes{background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 7px)}
  .roller-symbol.waves{background:repeating-radial-gradient(ellipse at 50% 120%,transparent 0 4px,currentColor 5px 6px,transparent 7px 10px)}
  .roller-symbol.checker{background:conic-gradient(currentColor 25%,transparent 0 50%,currentColor 0 75%,transparent 0) 0 0/10px 10px}
  .roller-symbol.solid{background:currentColor}
  .roller-symbol.rainbow{background:linear-gradient(90deg,#ff6868,#ffbd4a,#6bcf7f,#5ab8ff,#a77bff)}

  .palette{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
  .swatch{aspect-ratio:1;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #cbd1cf;cursor:pointer;padding:0;min-width:0}
  .swatch.active{box-shadow:0 0 0 3px #263238;transform:scale(.88)}
  .custom-color{display:flex;align-items:center;gap:8px;margin-top:9px}
  input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:9px;background:white}
  .slider-row{display:grid;grid-template-columns:72px 1fr 48px;gap:8px;align-items:center;margin:8px 0}
  .slider-row label{font-size:12px;font-weight:700}
  .slider-row output{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .bg-row{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .bg-btn{aspect-ratio:1;border-radius:10px;padding:0;position:relative}
  .bg-btn.active:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;text-shadow:0 1px 3px white,0 1px 3px white}
  .toggle-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px;font-weight:700}
  .switch{position:relative;width:44px;height:25px;display:inline-block}
  .switch input{opacity:0;width:0;height:0}
  .slider-switch{position:absolute;inset:0;background:#ccd2cf;border-radius:999px;cursor:pointer;transition:.2s}
  .slider-switch:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:white;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:.2s}
  .switch input:checked + .slider-switch{background:var(--accent2)}
  .switch input:checked + .slider-switch:before{transform:translateX(19px)}
  .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .action-btn{padding:10px 6px;font-weight:800;font-size:13px}
  .action-btn.primary{background:var(--accent2);border-color:var(--accent2);color:white}
  .action-btn.danger{color:#c24343}
  .action-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

  .stage-panel{padding:14px}
  .stage-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
  .status-dot{width:8px;height:8px;background:#5bc57c;border-radius:50%;box-shadow:0 0 0 4px rgba(91,197,124,.16)}
  .mini-actions{display:flex;gap:6px}
  .mini-actions button{border:1px solid var(--line);background:white;border-radius:9px;padding:6px 9px;cursor:pointer;font-size:12px}
  .canvas-shell{position:relative;width:100%;aspect-ratio:4/3;background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.11),0 10px 25px rgba(35,45,50,.10);user-select:none;-webkit-user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  .grid-overlay{position:absolute;inset:0;pointer-events:none;display:none;background-image:linear-gradient(rgba(70,90,95,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(70,90,95,.12) 1px,transparent 1px);background-size:10% 10%}
  .grid-overlay.show{display:block}
  .canvas-message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;color:rgba(38,50,56,.43);transition:opacity .2s;width:80%}
  .canvas-message strong{display:block;font-size:clamp(18px,3vw,34px);margin-bottom:4px}
  .canvas-message span{font-size:clamp(11px,1.6vw,16px)}
  .canvas-message.hidden{opacity:0}
  .stage-note{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:var(--muted);font-size:11px;line-height:1.5}
  .kbd{border:1px solid #cfd4d2;border-bottom-width:2px;border-radius:5px;background:white;padding:1px 5px;color:#4c5a5f}
  .footer-note{text-align:center;color:#7b8588;font-size:11px;margin-top:14px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#263238;color:white;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.22)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:900px){
    .app{padding:9px 9px 18px}
    header{margin-bottom:9px}.logo{width:42px;height:42px}.badge{display:none}
    .workspace{grid-template-columns:1fr;display:flex;flex-direction:column-reverse}
    .controls{position:static;max-height:none;width:100%}
    .stage-panel{padding:9px}
    .stage-top{margin-bottom:7px}
    .stage-note{display:none}
  }
  @media(max-width:480px){
    .subtitle{display:none}.app{padding:7px}
    h1{font-size:20px}.panel{border-radius:14px}.controls{padding:11px}
    .choice-grid{grid-template-columns:repeat(4,1fr)}
    .choice-btn{min-height:48px}.choice-btn .shape{font-size:22px}
    .palette{gap:6px}.slider-row{grid-template-columns:62px 1fr 42px}
    .stage-top .status span:last-child{display:none}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-wrap">
      <div class="logo" aria-hidden="true">◉</div>
      <div>
        <h1>デジタルもよう工房</h1>
        <p class="subtitle">スタンプとスポンジローラーで、色・形・重なりを自由に試そう</p>
      </div>
    </div>
    <div class="badge">1ファイル・スマホ対応</div>
  </header>

  <main class="workspace">
    <aside class="panel controls" aria-label="制作ツール">
      <section class="section">
        <div class="section-title">道具を選ぶ <span class="hint">タップして切替</span></div>
        <div class="tool-row">
          <button class="tool-btn active" data-tool="stamp" aria-pressed="true"><span aria-hidden="true">●</span> スタンプ</button>
          <button class="tool-btn" data-tool="roller" aria-pressed="false"><span aria-hidden="true">▰</span> ローラー</button>
        </div>
      </section>

      <section class="section" id="stampSection">
        <div class="section-title">スタンプの形 <span class="hint">押しながら動かせます</span></div>
        <div class="choice-grid" id="stampChoices">
          <button class="choice-btn active" data-stamp="circle"><span class="shape">●</span><span>まる</span></button>
          <button class="choice-btn" data-stamp="square"><span class="shape">■</span><span>しかく</span></button>
          <button class="choice-btn" data-stamp="triangle"><span class="shape">▲</span><span>さんかく</span></button>
          <button class="choice-btn" data-stamp="star"><span class="shape">★</span><span>ほし</span></button>
          <button class="choice-btn" data-stamp="heart"><span class="shape">♥</span><span>ハート</span></button>
          <button class="choice-btn" data-stamp="flower"><span class="shape">✿</span><span>はな</span></button>
          <button class="choice-btn" data-stamp="leaf"><span class="shape">◆</span><span>はっぱ</span></button>
          <button class="choice-btn" data-stamp="ring"><span class="shape">◎</span><span>わ</span></button>
        </div>
      </section>

      <section class="section" id="rollerSection" hidden>
        <div class="section-title">ローラーの模様 <span class="hint">ゆっくり動かすと濃くなります</span></div>
        <div class="choice-grid" id="rollerChoices">
          <button class="choice-btn active" data-roller="solid"><span class="roller-symbol solid"></span><span>スポンジ</span></button>
          <button class="choice-btn" data-roller="dots"><span class="roller-symbol dots"></span><span>ドット</span></button>
          <button class="choice-btn" data-roller="stripes"><span class="roller-symbol stripes"></span><span>しま</span></button>
          <button class="choice-btn" data-roller="waves"><span class="roller-symbol waves"></span><span>なみ</span></button>
          <button class="choice-btn" data-roller="checker"><span class="roller-symbol checker"></span><span>チェック</span></button>
          <button class="choice-btn" data-roller="rainbow"><span class="roller-symbol rainbow"></span><span>にじ</span></button>
        </div>
      </section>

      <section class="section">
        <div class="section-title">色を選ぶ</div>
        <div class="palette" id="palette"></div>
        <div class="custom-color">
          <input type="color" id="customColor" value="#f15a4a" aria-label="自由な色を選ぶ">
          <span class="hint">好きな色を作る</span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">大きさ・表情</div>
        <div class="slider-row">
          <label for="sizeRange">大きさ</label>
          <input id="sizeRange" type="range" min="18" max="220" value="86">
          <output id="sizeOut">86</output>
        </div>
        <div class="slider-row" id="rotationRow">
          <label for="rotationRange">回転</label>
          <input id="rotationRange" type="range" min="-180" max="180" value="0">
          <output id="rotationOut">0°</output>
        </div>
        <div class="slider-row">
          <label for="opacityRange">濃さ</label>
          <input id="opacityRange" type="range" min="15" max="100" value="82">
          <output id="opacityOut">82%</output>
        </div>
        <div class="slider-row">
          <label for="textureRange">かすれ</label>
          <input id="textureRange" type="range" min="0" max="100" value="38">
          <output id="textureOut">38%</output>
        </div>
      </section>

      <section class="section">
        <div class="section-title">画用紙</div>
        <div class="bg-row" id="bgChoices">
          <button class="bg-btn active" data-bg="#fffdf7" style="background:#fffdf7" aria-label="白い画用紙"></button>
          <button class="bg-btn" data-bg="#f6edda" style="background:#f6edda" aria-label="クリーム色の画用紙"></button>
          <button class="bg-btn" data-bg="#e4f3ef" style="background:#e4f3ef" aria-label="薄緑の画用紙"></button>
          <button class="bg-btn" data-bg="#e5eef8" style="background:#e5eef8" aria-label="薄青の画用紙"></button>
          <button class="bg-btn" data-bg="#f7e6ea" style="background:#f7e6ea" aria-label="薄桃の画用紙"></button>
          <button class="bg-btn" data-bg="#263238" style="background:#263238" aria-label="黒い画用紙"></button>
        </div>
        <div class="toggle-line">
          <span>構成用のマス目を表示</span>
          <label class="switch"><input type="checkbox" id="gridToggle"><span class="slider-switch"></span></label>
        </div>
      </section>

      <section class="section">
        <div class="actions">
          <button class="action-btn" id="undoBtn" disabled>↶ 元に戻す</button>
          <button class="action-btn" id="redoBtn" disabled>↷ やり直す</button>
          <button class="action-btn danger" id="clearBtn">× 全消去</button>
          <button class="action-btn primary" id="saveBtn">↓ 画像保存</button>
        </div>
      </section>
    </aside>

    <section class="panel stage-panel" aria-label="制作画面">
      <div class="stage-top">
        <div class="status"><span class="status-dot"></span><strong id="toolStatus">スタンプ</strong><span>で制作中</span></div>
        <div class="mini-actions">
          <button id="randomBtn" title="色・形・大きさをランダムに選びます">おまかせ</button>
          <button id="fullscreenBtn" title="制作画面を大きく表示します">大きく表示</button>
        </div>
      </div>
      <div class="canvas-shell" id="canvasShell">
        <canvas id="artCanvas" width="1200" height="900" aria-label="模様を描く画面"></canvas>
        <div class="grid-overlay" id="gridOverlay"></div>
        <div class="canvas-message" id="canvasMessage"><strong>ここに押してみよう</strong><span>スタンプはタップ、ローラーは指やマウスで動かします</span></div>
      </div>
      <div class="stage-note">
        <span>画像保存すると、マス目は消えて作品だけが保存されます。</span>
        <span><span class="kbd">Ctrl</span>＋<span class="kbd">Z</span> 元に戻す ／ <span class="kbd">Ctrl</span>＋<span class="kbd">S</span> 保存</span>
      </div>
    </section>
  </main>
  <div class="footer-note">ブラウザだけで動作します。作品データは端末内で処理され、外部へ送信されません。</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('artCanvas');
  const ctx = canvas.getContext('2d', { alpha:true, willReadFrequently:true });
  const shell = document.getElementById('canvasShell');
  const message = document.getElementById('canvasMessage');
  const gridOverlay = document.getElementById('gridOverlay');
  const toastEl = document.getElementById('toast');

  const state = {
    tool:'stamp', stamp:'circle', roller:'solid', color:'#f15a4a',
    size:86, rotation:0, opacity:.82, texture:.38, background:'#fffdf7',
    drawing:false, moved:false, last:null, lastStamp:null, artCount:0
  };

  const colors = ['#f15a4a','#ff973b','#ffd23f','#6cc56d','#22a9a1','#3987d8','#7357c8','#d4519a','#7b4e35','#263238','#ffffff','#a8b2b7'];
  const palette = document.getElementById('palette');
  colors.forEach((color,i) => {
    const b=document.createElement('button'); b.className='swatch'+(i===0?' active':'');
    b.style.background=color; b.dataset.color=color; b.setAttribute('aria-label',color+'を選ぶ');
    palette.appendChild(b);
  });

  let history=[], historyIndex=-1;
  const HISTORY_MAX=12;
  function snapshot(){
    if(historyIndex < history.length-1) history=history.slice(0,historyIndex+1);
    try{
      history.push(ctx.getImageData(0,0,canvas.width,canvas.height));
      if(history.length>HISTORY_MAX) history.shift(); else historyIndex++;
      historyIndex=history.length-1;
    }catch(e){ console.warn('履歴を保存できませんでした',e); }
    updateHistoryButtons();
  }
  function restore(index){
    if(index<0 || index>=history.length) return;
    historyIndex=index; ctx.putImageData(history[index],0,0);
    state.artCount = isBlank() ? 0 : 1;
    updateEmptyMessage(); updateHistoryButtons();
  }
  function updateHistoryButtons(){
    document.getElementById('undoBtn').disabled=historyIndex<=0;
    document.getElementById('redoBtn').disabled=historyIndex>=history.length-1;
  }
  function isBlank(){
    const d=ctx.getImageData(0,0,canvas.width,canvas.height).data;
    for(let i=3;i<d.length;i+=4) if(d[i]) return false;
    return true;
  }
  snapshot();

  function showToast(text){
    toastEl.textContent=text; toastEl.classList.add('show');
    clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>toastEl.classList.remove('show'),1800);
  }
  function updateEmptyMessage(){ message.classList.toggle('hidden',state.artCount>0); }
  function setActive(container, selector, value){
    container.querySelectorAll(selector).forEach(el=>el.classList.toggle('active',Object.values(el.dataset).includes(value)));
  }
  function setTool(tool){
    state.tool=tool;
    document.querySelectorAll('.tool-btn').forEach(b=>{
      const on=b.dataset.tool===tool; b.classList.toggle('active',on); b.setAttribute('aria-pressed',on);
    });
    document.getElementById('stampSection').hidden=tool!=='stamp';
    document.getElementById('rollerSection').hidden=tool!=='roller';
    document.getElementById('rotationRow').style.display=tool==='stamp'?'grid':'none';
    document.getElementById('toolStatus').textContent=tool==='stamp'?'スタンプ':'スポンジローラー';
    canvas.style.cursor=tool==='stamp'?'crosshair':'cell';
  }

  document.querySelectorAll('.tool-btn').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
  document.getElementById('stampChoices').addEventListener('click',e=>{
    const b=e.target.closest('[data-stamp]'); if(!b)return; state.stamp=b.dataset.stamp;
    setActive(document.getElementById('stampChoices'),'[data-stamp]',state.stamp);
  });
  document.getElementById('rollerChoices').addEventListener('click',e=>{
    const b=e.target.closest('[data-roller]'); if(!b)return; state.roller=b.dataset.roller;
    setActive(document.getElementById('rollerChoices'),'[data-roller]',state.roller);
  });
  palette.addEventListener('click',e=>{
    const b=e.target.closest('[data-color]'); if(!b)return; state.color=b.dataset.color;
    document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b));
    document.getElementById('customColor').value=state.color;
  });
  document.getElementById('customColor').addEventListener('input',e=>{
    state.color=e.target.value; document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));
  });

  const sliders=[
    ['sizeRange','sizeOut',v=>{state.size=+v;return v;}],
    ['rotationRange','rotationOut',v=>{state.rotation=+v;return v+'°';}],
    ['opacityRange','opacityOut',v=>{state.opacity=+v/100;return v+'%';}],
    ['textureRange','textureOut',v=>{state.texture=+v/100;return v+'%';}]
  ];
  sliders.forEach(([id,out,fn])=>document.getElementById(id).addEventListener('input',e=>document.getElementById(out).value=fn(e.target.value)));

  document.getElementById('bgChoices').addEventListener('click',e=>{
    const b=e.target.closest('[data-bg]'); if(!b)return; state.background=b.dataset.bg;
    shell.style.background=state.background;
    document.querySelectorAll('.bg-btn').forEach(x=>x.classList.toggle('active',x===b));
  });
  document.getElementById('gridToggle').addEventListener('change',e=>gridOverlay.classList.toggle('show',e.target.checked));

  function pointFromEvent(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
  }
  function seededNoise(x,y,n){
    const s=Math.sin(x*12.9898+y*78.233+n*37.719)*43758.5453;
    return s-Math.floor(s);
  }
  function pathForShape(g,shape,size){
    const r=size*.46;
    g.beginPath();
    if(shape==='circle'){g.arc(0,0,r,0,Math.PI*2);}
    else if(shape==='square'){g.roundRect(-r,-r,r*2,r*2,Math.max(3,size*.08));}
    else if(shape==='triangle'){
      for(let i=0;i<3;i++){const a=-Math.PI/2+i*Math.PI*2/3;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();
    }
    else if(shape==='star'){
      for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.44:r;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();
    }
    else if(shape==='heart'){
      g.moveTo(0,r*.82);g.bezierCurveTo(-r*1.15,r*.1,-r*.95,-r*.75,-r*.42,-r*.72);g.bezierCurveTo(-r*.12,-r*.72,0,-r*.46,0,-r*.32);g.bezierCurveTo(0,-r*.46,r*.12,-r*.72,r*.42,-r*.72);g.bezierCurveTo(r*.95,-r*.75,r*1.15,r*.1,0,r*.82);g.closePath();
    }
    else if(shape==='flower'){
      for(let i=0;i<8;i++){const a=i*Math.PI/4;g.moveTo(Math.cos(a)*r*.35,Math.sin(a)*r*.35);g.arc(Math.cos(a)*r*.63,Math.sin(a)*r*.63,r*.36,0,Math.PI*2);}g.arc(0,0,r*.34,0,Math.PI*2);
    }
    else if(shape==='leaf'){
      g.moveTo(-r,0);g.quadraticCurveTo(-r*.12,-r*1.05,r,0);g.quadraticCurveTo(-r*.12,r*1.05,-r,0);g.closePath();
    }
    else if(shape==='ring'){
      g.arc(0,0,r,0,Math.PI*2);g.moveTo(r*.55,0);g.arc(0,0,r*.55,0,Math.PI*2,true);
    }
  }
  function makeStampTip(shape,size,color,opacity,texture,rotation){
    const pad=Math.ceil(size*.2+8), side=Math.ceil(size+pad*2);
    const t=document.createElement('canvas'); t.width=t.height=side;
    const g=t.getContext('2d'); g.translate(side/2,side/2);g.rotate(rotation*Math.PI/180);
    pathForShape(g,shape,size); g.fillStyle=color;g.globalAlpha=opacity;g.fill('evenodd');
    if(texture>0){
      g.globalCompositeOperation='destination-out';g.globalAlpha=.22+.5*texture;
      const count=Math.floor(20+texture*110);
      for(let i=0;i<count;i++){
        const a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*size*.45;
        const x=Math.cos(a)*rr,y=Math.sin(a)*rr,rad=(.6+Math.random()*2.6)*texture;
        g.beginPath();g.arc(x,y,rad,0,Math.PI*2);g.fill();
      }
    }
    return t;
  }
  function makeRollerTip(size,pattern,color,opacity,texture){
    const side=Math.ceil(size*1.18+12),c=side/2,r=size*.48;
    const t=document.createElement('canvas');t.width=t.height=side;
    const g=t.getContext('2d');
    g.save();g.beginPath();g.arc(c,c,r,0,Math.PI*2);g.clip();g.globalAlpha=opacity;
    if(pattern==='rainbow'){
      const grad=g.createLinearGradient(c-r,c,c+r,c);['#ff5e62','#ffb84d','#f4dd4d','#57c777','#43a9e6','#8a63d2'].forEach((v,i,a)=>grad.addColorStop(i/(a.length-1),v));g.fillStyle=grad;g.fillRect(c-r,c-r,r*2,r*2);
    }else if(pattern==='solid'){
      g.fillStyle=color;g.fillRect(c-r,c-r,r*2,r*2);
    }else{
      g.fillStyle=color;
      if(pattern==='dots'){
        const step=Math.max(8,size*.22),dot=Math.max(2,size*.055);
        for(let y=c-r-step;y<c+r+step;y+=step)for(let x=c-r-step;x<c+r+step;x+=step){g.beginPath();g.arc(x,y,dot,0,Math.PI*2);g.fill();}
      }else if(pattern==='stripes'){
        const w=Math.max(4,size*.11);for(let x=c-r*1.5;x<c+r*1.5;x+=w*2)g.fillRect(x,c-r*1.5,w,r*3);
      }else if(pattern==='waves'){
        g.lineWidth=Math.max(3,size*.07);g.strokeStyle=color;
        const gap=Math.max(11,size*.24),amp=Math.max(4,size*.08);
        for(let y=c-r;y<c+r+gap;y+=gap){g.beginPath();for(let x=c-r-10;x<c+r+10;x+=4){const yy=y+Math.sin((x-c)/Math.max(8,size*.18)*Math.PI)*amp;x===c-r-10?g.moveTo(x,yy):g.lineTo(x,yy);}g.stroke();}
      }else if(pattern==='checker'){
        const s=Math.max(7,size*.19);for(let y=c-r-s;y<c+r+s;y+=s)for(let x=c-r-s;x<c+r+s;x+=s)if(((Math.floor((x-c)/s)+Math.floor((y-c)/s))&1)===0)g.fillRect(x,y,s,s);
      }
    }
    g.restore();
    if(texture>0){
      g.globalCompositeOperation='destination-out';g.globalAlpha=.18+.48*texture;
      const count=Math.floor(18+texture*90);
      for(let i=0;i<count;i++){
        const a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*r;
        g.beginPath();g.arc(c+Math.cos(a)*rr,c+Math.sin(a)*rr,(.5+Math.random()*2.2)*texture,0,Math.PI*2);g.fill();
      }
    }
    return t;
  }

  function drawStampAt(p,slightRandom=false){
    const randomRot=slightRandom?(Math.random()-.5)*8:0;
    const randomScale=slightRandom ? .92+Math.random()*.16 : 1;
    const tip=makeStampTip(state.stamp,state.size*randomScale,state.color,state.opacity,state.texture,state.rotation+randomRot);
    ctx.drawImage(tip,p.x-tip.width/2,p.y-tip.height/2);
    state.artCount++; updateEmptyMessage();
  }
  let rollerTipCache={key:'',tip:null};
  function getRollerTip(){
    const key=[state.size,state.roller,state.color,state.opacity.toFixed(3),state.texture.toFixed(3)].join('|');
    if(rollerTipCache.key!==key){
      rollerTipCache={key,tip:makeRollerTip(state.size,state.roller,state.color,state.opacity,state.texture)};
    }
    return rollerTipCache.tip;
  }
  function drawRollerDab(p){
    const tip=getRollerTip();
    const jitter=state.texture*state.size*.025;
    ctx.drawImage(tip,p.x-tip.width/2+(Math.random()-.5)*jitter,p.y-tip.height/2+(Math.random()-.5)*jitter);
    state.artCount++; updateEmptyMessage();
  }
  function drawLineDabs(a,b){
    const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),spacing=Math.max(3,state.size*.105);
    const steps=Math.max(1,Math.ceil(dist/spacing));
    for(let i=1;i<=steps;i++) drawRollerDab({x:a.x+dx*i/steps,y:a.y+dy*i/steps});
  }

  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault();canvas.setPointerCapture(e.pointerId);state.drawing=true;state.moved=false;
    const p=pointFromEvent(e);state.last=p;state.lastStamp=p;
    if(state.tool==='stamp') drawStampAt(p,true); else drawRollerDab(p);
  });
  canvas.addEventListener('pointermove',e=>{
    if(!state.drawing)return;e.preventDefault();const p=pointFromEvent(e);
    if(Math.hypot(p.x-state.last.x,p.y-state.last.y)>2)state.moved=true;
    if(state.tool==='roller'){drawLineDabs(state.last,p);state.last=p;}
    else{
      const spacing=Math.max(18,state.size*.72);
      if(Math.hypot(p.x-state.lastStamp.x,p.y-state.lastStamp.y)>=spacing){drawStampAt(p,true);state.lastStamp=p;}
    }
  });
  function endDraw(e){
    if(!state.drawing)return;state.drawing=false;
    try{canvas.releasePointerCapture(e.pointerId);}catch(_){ }
    snapshot();
  }
  canvas.addEventListener('pointerup',endDraw);canvas.addEventListener('pointercancel',endDraw);
  canvas.addEventListener('contextmenu',e=>e.preventDefault());

  document.getElementById('undoBtn').addEventListener('click',()=>restore(historyIndex-1));
  document.getElementById('redoBtn').addEventListener('click',()=>restore(historyIndex+1));
  document.getElementById('clearBtn').addEventListener('click',()=>{
    if(state.artCount>0 && !confirm('画面の作品をすべて消しますか？'))return;
    ctx.clearRect(0,0,canvas.width,canvas.height);state.artCount=0;updateEmptyMessage();snapshot();showToast('画面をきれいにしました');
  });
  function saveImage(){
    const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;
    const g=out.getContext('2d');g.fillStyle=state.background;g.fillRect(0,0,out.width,out.height);g.drawImage(canvas,0,0);
    const now=new Date(),pad=n=>String(n).padStart(2,'0');
    const filename=`もよう作品_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.png`;
    out.toBlob(blob=>{
      if(!blob){showToast('保存できませんでした');return;}
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('PNG画像を保存しました');
    },'image/png');
  }
  document.getElementById('saveBtn').addEventListener('click',saveImage);

  document.getElementById('randomBtn').addEventListener('click',()=>{
    const stamps=['circle','square','triangle','star','heart','flower','leaf','ring'];
    const rollers=['solid','dots','stripes','waves','checker','rainbow'];
    state.color=colors[Math.floor(Math.random()*10)];state.size=45+Math.floor(Math.random()*105);state.rotation=-180+Math.floor(Math.random()*361);
    if(state.tool==='stamp'){state.stamp=stamps[Math.floor(Math.random()*stamps.length)];setActive(document.getElementById('stampChoices'),'[data-stamp]',state.stamp);}
    else{state.roller=rollers[Math.floor(Math.random()*rollers.length)];setActive(document.getElementById('rollerChoices'),'[data-roller]',state.roller);}
    document.getElementById('sizeRange').value=state.size;document.getElementById('sizeOut').value=state.size;
    document.getElementById('rotationRange').value=state.rotation;document.getElementById('rotationOut').value=state.rotation+'°';
    document.getElementById('customColor').value=state.color;
    document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x.dataset.color===state.color));
    showToast('おまかせで道具を選びました');
  });
  document.getElementById('fullscreenBtn').addEventListener('click',async()=>{
    try{
      if(!document.fullscreenElement){await shell.requestFullscreen();document.getElementById('fullscreenBtn').textContent='元の大きさ';}
      else{await document.exitFullscreen();}
    }catch(_){showToast('このブラウザでは大きく表示できません');}
  });
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.getElementById('fullscreenBtn').textContent='大きく表示';});

  document.addEventListener('keydown',e=>{
    const mod=e.ctrlKey||e.metaKey;if(!mod)return;
    if(e.key.toLowerCase()==='z'){e.preventDefault();restore(historyIndex+(e.shiftKey?1:-1));}
    else if(e.key.toLowerCase()==='y'){e.preventDefault();restore(historyIndex+1);}
    else if(e.key.toLowerCase()==='s'){e.preventDefault();saveImage();}
  });

  shell.style.background=state.background;updateEmptyMessage();setTool('stamp');
})();
</script>
</body>
</html>
